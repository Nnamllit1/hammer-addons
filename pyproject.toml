[project]
name = "h2mcp"
version = "0.1.0"
description = "Local CS2 Workshop Tools and Hammer mapping MCP server"
readme = "README.md"
authors = [
    { name = "nnamllit11" }
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.26,<2",
]

[project.scripts]
h2mcp = "h2mcp:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
