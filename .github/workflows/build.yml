name: Native loader
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and test
        shell: powershell
        run: .\build.ps1 -Test
      - uses: actions/upload-artifact@v4
        with:
          name: hammer-addons-windows-x64
          path: dist/
